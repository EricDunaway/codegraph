[package]
name = "codegraph-vectors"
description = "Vector embeddings for semantic search in CodeGraph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable ONNX runtime for actual embedding generation
onnx = ["ort", "tokenizers", "ndarray"]
# CoreML acceleration for macOS
coreml = ["onnx"]

[dependencies]
codegraph-types = { path = "../codegraph-types" }
codegraph-db = { path = "../codegraph-db" }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }

# Optional ONNX dependencies
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
