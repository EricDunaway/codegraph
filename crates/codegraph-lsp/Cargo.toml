[package]
name = "codegraph-lsp"
description = "LSP enrichment for CodeGraph - language server integration for type inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
codegraph-types = { path = "../codegraph-types" }
codegraph-db = { path = "../codegraph-db" }

# LSP client (async-lsp is for clients, tower-lsp is for servers)
lsp-types = "0.97"
url = "2"

# Async runtime
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "rt", "rt-multi-thread"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
